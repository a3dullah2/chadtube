<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChadTube — your personal nerd TV</title>
<link rel="icon" type="image/png" href="chad.png">
<style>
  :root{
    --bg:#0b0b0d; --bg2:#131316; --fg:#f2f2f4; --muted:#9b9ba4;
    --line:#26262b; --accent:#e5484d; --card:#17171b;
  }
  html.light{
    --bg:#fafafa; --bg2:#ffffff; --fg:#17171b; --muted:#6b6b76;
    --line:#e4e4e8; --accent:#e5484d; --card:#ffffff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  input{font:inherit}
  header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
         backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .hrow{display:flex;align-items:center;gap:10px;height:56px;padding:0 16px}
  .logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px}
  .logo .chad-logo{height:34px;width:auto;user-select:none}
  /* mascot spins in on first page load, keeps spinning while hovered */
  @keyframes chad-spin-in{0%{transform:rotate(0deg) scale(.4);opacity:0}
                         55%{transform:rotate(720deg) scale(1.18);opacity:1}
                         100%{transform:rotate(720deg) scale(1);opacity:1}}
  @keyframes chad-spin{to{transform:rotate(360deg)}}
  .chad-logo{animation:chad-spin-in 1.5s cubic-bezier(.22,1,.36,1) 1 both}
  .chad-logo:hover{animation:chad-spin .9s linear infinite}
  @media (prefers-reduced-motion:reduce){.chad-logo{animation:none}}
  .search{flex:1;max-width:560px;margin:0 auto;position:relative}
  .search input{width:100%;height:36px;border-radius:999px;border:1px solid var(--line);
                background:var(--bg2);color:var(--fg);padding:0 14px;outline:none}
  .iconbtn{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;font-size:16px}
  .iconbtn:hover{background:var(--bg2)}
  #pkbtn.on{background:var(--fg);color:var(--bg)}
  .tvbtn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;
         border-radius:999px;padding:7px 14px;font-weight:600}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;border-bottom:1px solid var(--line);
         scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0;border:1px solid var(--line);border-radius:999px;padding:6px 13px;
        background:var(--bg2);display:inline-flex;align-items:center;gap:6px}
  .chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  .dot{width:8px;height:8px;border-radius:999px;display:inline-block}
  select{border:1px solid var(--line);background:var(--bg2);color:var(--fg);
         border-radius:999px;padding:6px 12px}
  main{max-width:1800px;margin:0 auto;padding:16px}
  .meta{color:var(--muted);margin:0 0 14px}
  .grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .card{text-align:left;display:block;width:100%}
  .thumb{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--card)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .seen .thumb img{opacity:.55}
  .dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.8);color:#fff;
       font-size:11px;padding:1px 5px;border-radius:4px}
  .tier{position:absolute;left:6px;top:6px;font-size:10px;font-weight:800;color:#111;
        padding:1px 6px;border-radius:4px}
  .card h3{margin:8px 0 4px;font-size:14px;font-weight:600;line-height:1.35;
           display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .sub{color:var(--muted);font-size:12px}
  .more{display:block;margin:18px auto;padding:9px 18px;border:1px solid var(--line);
        border-radius:999px;background:var(--bg2)}
  /* watch view */
  .watchwrap{max-width:1500px;margin:0 auto;padding:16px;display:grid;gap:20px;
             grid-template-columns:minmax(0,1fr) 360px}
  @media(max-width:1000px){.watchwrap{grid-template-columns:1fr}}
  .player{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
  .player iframe{width:100%;height:100%;border:0;display:block}
  .upnext{display:flex;flex-direction:column;gap:4px;max-height:80vh;overflow:auto}
  .upnext button{display:flex;gap:10px;padding:6px;border-radius:8px;text-align:left}
  .upnext button:hover{background:var(--bg2)}
  .upnext .mini{position:relative;flex:0 0 138px;aspect-ratio:16/9;border-radius:6px;overflow:hidden;
                background:var(--card)}
  .upnext .mini img{width:100%;height:100%;object-fit:cover}
  .backrow{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  /* theater mode: edge-to-edge player, up next becomes a horizontal strip */
  .watchwrap.theater{max-width:none;padding:0 0 16px;grid-template-columns:minmax(0,1fr)}
  .watchwrap.theater .watchmain{padding:0 16px}
  .watchwrap.theater .player{aspect-ratio:auto;height:min(85vh,56.25vw);border-radius:0;width:calc(100% + 32px);margin:0 -16px}
  .watchwrap.theater .upnextcol{padding:0 16px}
  .watchwrap.theater .upnext{flex-direction:row;max-height:none;overflow-x:auto;overflow-y:hidden;padding-bottom:4px}
  .watchwrap.theater .upnext button{flex-direction:column;flex:0 0 256px}
  .watchwrap.theater .upnext .mini{flex:none;width:100%}
  .pill{border:1px solid var(--line);border-radius:999px;padding:6px 13px;background:var(--bg2)}
  /* TV mode */
  #tv{position:fixed;inset:0;z-index:100;background:#000;color:#fff;display:none}
  #tv.on{display:block}
  #tv .catcher{position:absolute;inset:0;z-index:10}
  #tvosd{position:absolute;inset:0;z-index:20;pointer-events:none;opacity:1;transition:opacity .3s}
  #tvosd.dim{opacity:0}
  #tvosd .top{position:absolute;top:0;left:0;right:0;padding:14px;display:flex;justify-content:flex-end;gap:8px;
              background:linear-gradient(rgba(0,0,0,.7),transparent)}
  #tvosd .bot{position:absolute;bottom:0;left:0;right:0;padding:22px;padding-top:90px;
              background:linear-gradient(transparent,rgba(0,0,0,.88))}
  #tvosd .tbtn{pointer-events:auto;width:40px;height:40px;border-radius:999px;display:grid;place-items:center;
               background:rgba(255,255,255,.12);color:#fff}
  #tvbar{height:4px;background:rgba(255,255,255,.25);border-radius:999px;overflow:hidden;margin-top:10px}
  #tvbar div{height:100%;background:var(--accent);width:0}
  footer{border-top:1px solid var(--line);color:var(--muted);padding:16px;font-size:12px}
  .hidden{display:none!important}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <button class="logo" onclick="goHome()"><img src="chad.png" class="chad-logo" alt="ChadTube logo" draggable="false">ChadTube</button>
    <div class="search"><input id="q" placeholder="Search videos and channels…" aria-label="Search"></div>
    <button class="iconbtn" onclick="reshuffle()" title="Shuffle">🎲</button>
    <button class="iconbtn" onclick="toggleTheme()" id="themebtn" title="Toggle theme">🌙</button>
    <button class="iconbtn" onclick="togglePk()" id="pkbtn" title="Pakistani mode — hide Pakistani news & Islamic channels">🇵🇰</button>
    <button class="tvbtn" onclick="openTv()">📺 TV mode</button>
  </div>
  <div class="chips" id="chips"></div>
</header>

<main id="home">
  <p class="meta" id="metaline">Loading library…</p>
  <div class="grid" id="grid"></div>
  <button class="more hidden" id="more">Load more</button>
</main>

<div id="watch" class="watchwrap hidden">
  <div class="watchmain">
    <div class="backrow">
      <button class="pill" onclick="goHome()">← Back</button>
      <span class="sub" id="queueinfo"></span>
      <button class="pill" id="theaterbtn" style="margin-left:auto" onclick="toggleTheater()" title="Theater mode (t)">▭ Theater</button>
      <button class="pill" onclick="openTv(true)">📺 TV mode</button>
      <button class="pill" onclick="playNext()">Next ▶</button>
    </div>
    <div class="player" id="playerhost"></div>
    <h2 id="wtitle" style="margin:14px 0 6px;font-size:18px"></h2>
    <div class="sub" id="wmeta"></div>
  </div>
  <div class="upnextcol">
    <div class="sub" style="font-weight:700;margin-bottom:8px">Up next</div>
    <div class="upnext" id="upnext"></div>
  </div>
</div>

<div id="tv" role="dialog" aria-label="TV mode">
  <div id="tvhost" style="position:absolute;inset:0"></div>
  <div class="catcher" onclick="tvToggle()" aria-label="Toggle playback"></div>
  <div id="tvosd">
    <div class="top">
      <button class="tbtn" onclick="tvGo(tvIdx-1)">⏮</button>
      <button class="tbtn" onclick="tvGo(tvIdx+1)">⏭</button>
      <button class="tbtn" onclick="tvMute()">🔊</button>
      <button class="tbtn" onclick="closeTv()">✕</button>
    </div>
    <div class="bot">
      <div style="display:flex;justify-content:space-between;gap:16px">
        <div style="min-width:0">
          <div id="tvtitle" style="font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
          <div id="tvmeta" class="sub" style="color:#bbb;margin-top:4px"></div>
        </div>
        <div style="text-align:right;color:#999;flex-shrink:0">
          <div id="tvcount"></div>
          <div style="font-size:11px;margin-top:4px">space play · n next · p prev · m mute · ←→ seek · esc exit</div>
        </div>
      </div>
      <div id="tvbar"><div></div></div>
    </div>
  </div>
</div>

<footer>
  ChadTube — a personal, algorithm-free video site. Videos play via YouTube embeds ·
  inspired by Karpathy’s TristanTube · data harvested with yt-dlp.
</footer>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
"use strict";
const TIER_COLORS = {S:"#ff7a7a",A:"#ffb46b",B:"#ffe066",C:"#9be38a",D:"#7cc4ff",R:"#b8a1ff","★":"#ffd166"};
const PAGE = 40;
let DATA = null, q = "", tier = "all", sort = "newest", seed = 1, visible = PAGE, PK = false;
let view = "home", queueList = [], current = null, player = null;
let tvIdx = 0, tvPlayer = null, tvCountdown = null, tvIdle = null;
let hist = [];
try { hist = JSON.parse(localStorage.getItem("mytube.hist") || "[]"); } catch {}

/* ---------- helpers ---------- */
const $ = (s) => document.querySelector(s);
const thumb = (id, big) => `https://i.ytimg.com/vi/${id}/${big ? "hq" : "mq"}default.jpg`;
function fmtDur(d){ if(!d||d<=0) return ""; const h=d/3600|0,m=(d%3600)/60|0,s=d%60|0;
  return h?`${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`:`${m}:${String(s).padStart(2,"0")}`; }
function fmtViews(v){ if(!v||v<=0) return "";
  if(v>=1e9) return (v/1e9).toFixed(1).replace(/\.0$/,"")+"B views";
  if(v>=1e6) return (v/1e6).toFixed(1).replace(/\.0$/,"")+"M views";
  if(v>=1e3) return (v/1e3).toFixed(1).replace(/\.0$/,"")+"K views";
  return v+" views"; }
function fmtAge(ts){ if(!ts) return ""; const days=Math.floor((Date.now()/1e3-ts)/86400);
  if(days<1) return "today"; if(days===1) return "1 day ago";
  if(days<30) return days+" days ago";
  if(days<365){const m=Math.round(days/30);return m<=1?"1 month ago":m+" months ago";}
  const y=Math.round(days/365); return y<=1?"1 year ago":y+" years ago"; }
const metaJoin = (...p) => p.filter(Boolean).join(" · ");
function shuffleSeeded(arr, s){ const a=[...arr];
  let x=s>>>0; const rnd=()=>{x|=0;x=x+0x6D2B79F5|0;let t=Math.imul(x^x>>>15,1|x);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
  for(let i=a.length-1;i>0;i--){const j=rnd()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(s){return (s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}
function interleaveChannels(videos){
  const groups=new Map();
  for(const v of videos){const k=v.up?"u:"+v.up:"c:"+v.c;const g=groups.get(k);if(g)g.push(v);else groups.set(k,[v]);}
  const out=[];
  for(;;){const round=[];
    for(const g of groups.values()){const v=g.shift();if(v)round.push(v);}
    if(!round.length)break;
    round.sort((a,b)=>(b.ts??0)-(a.ts??0)||b.v-a.v);
    out.push(...round);}
  return out;
}

/* ---------- data + filters ---------- */
async function boot(){
  try{ const r=await fetch("./videos.json"); DATA=await r.json(); }
  catch{ $("#metaline").textContent="Could not load videos.json — serve this folder over HTTP (e.g. python -m http.server)."; return; }
  renderChips(); render();
}
function filtered(){
  const ql=q.trim().toLowerCase();
  let out=DATA.videos.filter(v=>{
    const ch=DATA.channels[v.c];
    if(tier!=="all"&&ch.tier!==tier) return false;
    if(PK&&(ch.pk||v.pk)) return false;
    if(ql&&!v.t.toLowerCase().includes(ql)&&!`${ch.n} ${v.up||""}`.toLowerCase().includes(ql)) return false;
    return true;
  });
  // feed-level dedupe: channel copy wins over the playlist copy
  const seen=new Set();
  out=out.filter(v=>!seen.has(v.id)&&seen.add(v.id));
  if(sort==="newest") out=interleaveChannels([...out].sort((a,b)=>(b.ts??0)-(a.ts??0)||b.v-a.v));
  else if(sort==="views") out=[...out].sort((a,b)=>b.v-a.v);
  else if(sort==="longest") out=[...out].sort((a,b)=>b.d-a.d);
  else if(sort==="shuffle") out=shuffleSeeded(out,seed);
  return out;
}
function render(){
  const list=filtered();
  $("#metaline").textContent=`${list.length.toLocaleString()} videos · ${DATA.channels.length} channels · newest uploads spread across the whole line-up${PK?" · 🇵🇰 Pakistani mode: Pakistani channels hidden":""}${q.trim()?` · results for “${q.trim()}”`:""}`;
  const seenIds=new Set(hist);
  $("#grid").innerHTML=list.slice(0,visible).map(v=>{
    const ch=DATA.channels[v.c];
    return `<button class="card ${seenIds.has(v.id)?"seen":""}" onclick="openVideo('${v.id}')">
      <div class="thumb"><img loading="lazy" src="${thumb(v.id)}" alt="">
        ${fmtDur(v.d)?`<span class="dur">${fmtDur(v.d)}</span>`:""}
        <span class="tier" style="background:${TIER_COLORS[ch.tier]}">${ch.tier}</span></div>
      <h3>${esc(v.t)}</h3>
      <div class="sub">${esc(metaJoin(v.up||ch.n,fmtViews(v.v),fmtAge(v.ts)))}</div>
    </button>`;
  }).join("");
  $("#more").classList.toggle("hidden",visible>=list.length);
  $("#more").textContent=`Load more (${(list.length-visible).toLocaleString()} remaining)`;
}
function renderChips(){
  const tiers=["all","S","A","B","C","D","R","★"];
  $("#chips").innerHTML=tiers.map(t=>`<button class="chip ${tier===t?"on":""}" onclick="setTier('${t}')">${
    t==="all"?"All":`<span class="dot" style="background:${TIER_COLORS[t]}"></span>${t}`}</button>`).join("")
    +`<span style="flex:1"></span><select onchange="setSort(this.value)" aria-label="Sort">
      ${["newest","views","longest","shuffle"].map(s=>`<option value="${s}" ${sort===s?"selected":""}>${
        {newest:"Newest (mixed)",views:"Most viewed",longest:"Longest",shuffle:"Shuffled"}[s]}</option>`).join("")}
    </select>`;
}
function setTier(t){tier=t;visible=PAGE;renderChips();render();window.scrollTo({top:0});}
function setSort(s){sort=s;visible=PAGE;render();window.scrollTo({top:0});}
function togglePk(){PK=!PK;visible=PAGE;try{localStorage.setItem("chadtube.pk",PK?"1":"0")}catch{}
  const b=$("#pkbtn");if(b)b.classList.toggle("on",PK);render();window.scrollTo({top:0});}
function reshuffle(){sort="shuffle";seed=(Math.random()*1e9)|0;visible=PAGE;renderChips();render();}
$("#q").addEventListener("input",e=>{q=e.target.value;visible=PAGE;render();});
$("#more").addEventListener("click",()=>{visible+=PAGE*2;render();});

/* ---------- theater ---------- */
let theater=false;try{theater=localStorage.getItem("chadtube.theater")==="1"}catch{}
function toggleTheater(){theater=!theater;try{localStorage.setItem("chadtube.theater",theater?"1":"0")}catch{}applyTheater();}
function applyTheater(){const w=$("#watch");if(w)w.classList.toggle("theater",theater);}

/* ---------- watch ---------- */
let ytReady=false, pendingOpen=null;
window.onYouTubeIframeAPIReady=()=>{ytReady=true;if(pendingOpen){openVideo(pendingOpen);pendingOpen=null;}};
/* Cached-widget race: the API can fire before this script assigns the handler
   above, in which case YT.Player already exists and the callback never comes. */
if(window.YT&&YT.Player){ytReady=true;if(pendingOpen){openVideo(pendingOpen);pendingOpen=null;}}
function newPlayer(host,vid,onEnd){
  if(player){player.destroy();player=null;}
  player=new YT.Player(host,{videoId:vid,playerVars:{autoplay:1,rel:0,modestbranding:1},
    events:{onStateChange:e=>{if(e.data===0&&onEnd)onEnd();}}});
}
function openVideo(id){
  if(!ytReady){pendingOpen=id;return;}
  const v=DATA.videos.find(x=>x.id===id); if(!v) return;
  current=v;
  if(view!=="watch"){queueList=filtered();}
  view="watch";
  $("#home").classList.add("hidden"); $("#watch").classList.remove("hidden"); applyTheater();
  const idx=queueList.findIndex(x=>x.id===id);
  $("#queueinfo").textContent=idx>=0?`${idx+1} / ${queueList.length} in queue`:"";
  $("#wtitle").textContent=v.t;
  const ch=DATA.channels[v.c];
  $("#wmeta").innerHTML=`<b style="color:var(--fg)">${esc(v.up||ch.n)}</b> · <span class="dot" style="background:${TIER_COLORS[ch.tier]}"></span> ${ch.tier} tier · ${esc(metaJoin(fmtViews(v.v),fmtAge(v.ts),fmtDur(v.d)))}`;
  newPlayer("playerhost",v.id,()=>{const n=nextVid();if(n)setTimeout(()=>openVideo(n.id),1500);});
  const up=queueList.slice(idx+1,idx+26);
  $("#upnext").innerHTML=up.map(u=>`<button onclick="openVideo('${u.id}')">
    <span class="mini"><img loading="lazy" src="${thumb(u.id)}" alt="">${fmtDur(u.d)?`<span class="dur">${fmtDur(u.d)}</span>`:""}</span>
    <span style="min-width:0"><span style="display:block;font-weight:600">${esc(u.t)}</span>
    <span class="sub">${esc(metaJoin(u.up||DATA.channels[u.c].n,fmtViews(u.v),fmtAge(u.ts)))}</span></span></button>`).join("")
    ||`<p class="sub">End of queue.</p>`;
  pushHist(v.id); window.scrollTo({top:0});
}
function nextVid(){const i=queueList.findIndex(x=>x.id===current.id);
  return queueList[i+1]??queueList[0]??null;}
function playNext(){const n=nextVid();if(n)openVideo(n.id);}
function goHome(){
  view="home"; if(player){player.destroy();player=null;}
  $("#watch").classList.add("hidden"); $("#home").classList.remove("hidden"); render();
}
function pushHist(id){
  hist=[id,...hist.filter(h=>h!==id)].slice(0,300);
  try{localStorage.setItem("mytube.hist",JSON.stringify(hist));}catch{}
}

/* ---------- TV mode ---------- */
function openTv(fromWatch){
  const list=(fromWatch||view==="watch")&&queueList.length?queueList:filtered();
  if(!list.length)return;
  queueList=list;
  if(view!=="watch"){view="watch";}
  tvIdx=(fromWatch&&current)?Math.max(0,queueList.findIndex(x=>x.id===current.id))
        :(Math.random()*queueList.length)|0;
  $("#tv").classList.add("on"); document.body.style.overflow="hidden";
  if(player){player.destroy();player=null;}
  tvMount();
}
function tvMount(){
  const n=queueList.length;
  tvIdx=((tvIdx%n)+n)%n;
  const v=queueList[tvIdx];
  if(tvPlayer){tvPlayer.destroy();tvPlayer=null;}
  tvPlayer=new YT.Player("tvhost",{videoId:v.id,playerVars:{autoplay:1,controls:0,rel:0,modestbranding:1},
    events:{onStateChange:e=>{
      if(e.data===0){ // ended → up-next countdown
        clearTimeout(tvCountdown); tvCountdown=setTimeout(()=>tvGo(tvIdx+1),5000);
      }else clearTimeout(tvCountdown);
    }}});
  const ch=DATA.channels[v.c];
  $("#tvtitle").textContent=v.t;
  $("#tvmeta").innerHTML=`<span class="dot" style="background:${TIER_COLORS[ch.tier]}"></span> ${esc(ch.n)} · ${esc(metaJoin(fmtViews(v.v),fmtDur(v.d)))}`;
  $("#tvcount").textContent=`${tvIdx+1} / ${n}`;
  pushHist(v.id);
  clearInterval(window.__tvTick);
  window.__tvTick=setInterval(()=>{
    if(!tvPlayer||!tvPlayer.getCurrentTime)return;
    try{const c=tvPlayer.getCurrentTime()||0,d=tvPlayer.getDuration()||0;
      $("#tvbar div").style.width=(d?c/d*100:0)+"%";}catch{}
  },1000);
  pokeOsd();
}
function tvGo(i){clearTimeout(tvCountdown);tvIdx=i;tvMount();}
function tvToggle(){try{const s=tvPlayer.getPlayerState();s===1?tvPlayer.pauseVideo():tvPlayer.playVideo();}catch{}}
function tvMute(){try{tvPlayer.isMuted()?tvPlayer.unMute():tvPlayer.mute();}catch{}}
function pokeOsd(){
  $("#tvosd").classList.remove("dim");
  clearTimeout(tvIdle); tvIdle=setTimeout(()=>$("#tvosd").classList.add("dim"),3500);
}
document.addEventListener("mousemove",()=>{if($("#tv").classList.contains("on"))pokeOsd();});
function closeTv(){
  clearTimeout(tvCountdown); $("#tv").classList.remove("on");
  document.body.style.overflow=""; if(tvPlayer){tvPlayer.destroy();tvPlayer=null;}
  if(current)openVideo(current.id);
}
document.addEventListener("keydown",e=>{
  if($("#tv").classList.contains("on")){
    if(e.key==="Escape")closeTv();
    else if(e.key===" "){e.preventDefault();tvToggle();}
    else if(e.key==="n")tvGo(tvIdx+1);
    else if(e.key==="p")tvGo(tvIdx-1);
    else if(e.key==="m")tvMute();
    else if(e.key==="ArrowRight"){e.preventDefault();try{tvPlayer.seekTo(tvPlayer.getCurrentTime()+10,true);}catch{}}
    else if(e.key==="ArrowLeft"){e.preventDefault();try{tvPlayer.seekTo(Math.max(0,tvPlayer.getCurrentTime()-10),true);}catch{}}
    return;
  }
  if(e.key==="Escape"&&view==="watch")goHome();
  else if(e.key==="t"&&view==="watch"){
    const el=e.target;
    if(!(el&&(el.tagName==="INPUT"||el.tagName==="TEXTAREA"||el.isContentEditable)))toggleTheater();
  }
});

/* ---------- theme ---------- */
function toggleTheme(){
  const light=document.documentElement.classList.toggle("light");
  $("#themebtn").textContent=light?"☀️":"🌙";
  try{localStorage.setItem("mytube.theme",light?"light":"dark");}catch{}
}
try{if(localStorage.getItem("mytube.theme")==="light"){document.documentElement.classList.add("light");$("#themebtn").textContent="☀️";}}catch{}
try{if(localStorage.getItem("chadtube.pk")==="1"){PK=true;const b=$("#pkbtn");if(b)b.classList.add("on");}}catch{}

boot();
</script>
